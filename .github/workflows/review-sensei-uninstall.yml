# ReviewSensei setup version: 5
name: Remove ReviewSensei setup

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize dispatches and reruns that share the cleanup branch.
concurrency:
  group: review-sensei-uninstall
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create cleanup pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import subprocess
          import sys

          default_branch = os.environ.get("DEFAULT_BRANCH", "")
          if not default_branch or default_branch.startswith("-") or subprocess.run(
              ["git", "check-ref-format", f"refs/heads/{default_branch}"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
          ).returncode != 0:
              print("::error::repository default branch is unavailable", file=sys.stderr)
              sys.exit(1)
          branch = "review-sensei/uninstall"
          if default_branch == branch:
              raise SystemExit("Cleanup branch must not be the default branch")
          paths = (
              ".github/workflows/review-sensei-review.yml",
              ".github/workflows/review-sensei-uninstall.yml",
              ".reviewsensei.yml",
              ".github/review-sensei/config.yml",
          )
          # Reuse the operation after a successful push, including PR-create failures.
          existing = json.loads(subprocess.check_output([
              "gh", "pr", "list", "--state", "all", "--head", branch,
              "--base", default_branch, "--json", "state,url,headRepositoryOwner,isCrossRepository",
          ], text=True))
          owner = os.environ["REPOSITORY"].split("/", 1)[0]
          existing = [pr for pr in existing if not pr["isCrossRepository"]
                      and pr["headRepositoryOwner"]["login"].casefold() == owner.casefold()]
          if existing:
              print(f"Cleanup PR already exists: {existing[0]['url']} ({existing[0]['state']}).")
              sys.exit(0)
          remote = subprocess.run([
              "git", "ls-remote", "--exit-code", "--heads", "origin", f"refs/heads/{branch}",
          ], stdout=subprocess.DEVNULL, check=False)
          if remote.returncode == 0:
              subprocess.run(["git", "fetch", "origin", f"refs/heads/{branch}"], check=True)
              # A stable name alone does not prove this is our interrupted cleanup.
              base = subprocess.check_output(["git", "merge-base", "HEAD", "FETCH_HEAD"], text=True).strip()
              current = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if base != current:
                  raise SystemExit("Cleanup base has changed; refusing automatic recovery")
              delta = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-status", "-z", base, "FETCH_HEAD", "--",
              ]).split(b"\0")
              allowed = {path.encode("utf-8") for path in paths}
              if (delta == [b""] or delta[-1] != b"" or len(delta) % 2 != 1
                  or any(delta[i] != b"D" or delta[i + 1] not in allowed
                         for i in range(0, len(delta) - 1, 2))):
                  raise SystemExit("Existing cleanup branch contains unexpected changes; refusing reuse")
              subprocess.run(["git", "switch", "--create", branch, "FETCH_HEAD"], check=True)
          elif remote.returncode == 2:
              subprocess.run(["git", "switch", "--create", branch], check=True)
          else:
              raise SystemExit("Cannot determine whether the cleanup branch exists")
          for path in paths:
              subprocess.run(["git", "rm", "--force", "--ignore-unmatch", "--", path], check=True)
          changes = subprocess.run(["git", "diff", "--cached", "--quiet", "--", *paths]).returncode
          if changes not in (0, 1):
              raise SystemExit("Cannot inspect cleanup changes")
          if changes == 0 and remote.returncode == 2:
              print("ReviewSensei setup files are already absent; no cleanup PR is needed.")
              sys.exit(0)
          if changes == 1:
              subprocess.run(["git", "-c", "user.name=github-actions[bot]", "-c",
                  "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m", "Remove ReviewSensei setup"], check=True)
              subprocess.run(["git", "push", "--set-upstream", "origin", branch], check=True)
          subprocess.run([
              "gh", "pr", "create", "--base", default_branch, "--head", branch,
              "--title", "Remove ReviewSensei setup",
              "--body", "Remove generated ReviewSensei setup files; learnings and secrets remain untouched.",
          ], check=True)
          PY
