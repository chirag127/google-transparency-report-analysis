name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e . 2>/dev/null || pip install --no-deps src/gtra 2>/dev/null || true

      - name: Build site data (copyright only — no network download in CI)
        run: |
          mkdir -p data/copyright docs/data
          python -c "
          import sys; sys.path.insert(0, 'src')
          from gtra.build_site_data import build
          from pathlib import Path
          build()
          " || echo "build_site_data skipped (no data)"

      - name: Verify docs/ exists
        run: ls docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
          cname: google-transparency-report-analysis.oriz.in
