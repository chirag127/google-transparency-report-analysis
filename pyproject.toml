[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
